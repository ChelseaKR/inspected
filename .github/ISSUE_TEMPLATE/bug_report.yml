name: Bug report
description: Something the code does that its documentation says it does not
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A defect here is usually one of two things: a number that is wrong, or a gate
        that passed something it should have refused. Both are worth reporting. The
        second is worth reporting even when nothing visibly broke, because a gate that
        cannot fail is the failure.

        Not this form: a security vulnerability. Those go through private reporting;
        see `SECURITY.md`.
  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: >-
        What you ran, copied rather than described, including flags. If it was
        `make verify`, say which target inside it failed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        The output, copied whole. A traceback is more useful than a summary of one.
    validations:
      required: true
  - type: textarea
    id: what-should-have-happened
    attributes:
      label: What should have happened, and what says so
      description: >-
        Point at the README, an ADR, a docstring, a Definition of Done item, or a test
        name. A defect is a gap between a published claim and the behaviour, so naming
        the claim is half the report. If nothing published says what should have
        happened, say that instead: an undocumented behaviour is its own finding.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        From a clean checkout, the shortest path to it. `uv sync --locked` then
        `make report-offline` builds the whole pipeline over committed fixtures in about
        a second, offline, so most reproductions need no data of your own.
      value: |
        1. uv sync --locked
        2.
        3.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Which commit
      description: The output of `git rev-parse HEAD`, or the release tag.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Operating system, the output of `uv run python --version`, and `uv --version`.
        Only if you think they matter; this pipeline reads local files and does the same
        arithmetic everywhere.
    validations:
      required: false
