name: Bug report
description: Something in this repository does not do what it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: `make verify` is the gate, and its output is the most useful
        thing you can paste here. If a gate refused something, `docs/RUNBOOK.md` says
        what each refusal means.
  - type: input
    id: commit
    attributes:
      label: Which commit
      description: The output of `git rev-parse HEAD`.
      placeholder: c8831ff
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Which command
      description: The exact command you ran, including its flags.
      placeholder: make report-offline
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Paste the output. A refusal message is evidence, not noise.
    validations:
      required: true
  - type: textarea
    id: what-should-have-happened
    attributes:
      label: What should have happened
      description: >
        Say which published document says so, if one does. A README claim, an ADR, or a
        docstring. If nothing says so, say that instead; a rule nobody wrote down is
        worth finding out about too.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: >
        Ideally against the committed fixtures, which run offline and anywhere. Never
        paste real damage-inspection records: they carry addresses and parcel numbers,
        and nothing in this repository wants them.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: What `make verify` said
      description: Optional, and the first thing a maintainer will ask for.
    validations:
      required: false
