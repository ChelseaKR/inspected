    url: https://github.com/ChelseaKR/wildfire-service-territory-overlap/security/advisories/new
    about: >
      Report a vulnerability privately. SECURITY.md carries the severity levels and the
      72 hour acknowledgment target.
  - name: How a gate refusal is meant to be read
    url: https://github.com/ChelseaKR/wildfire-service-territory-overlap/blob/main/docs/RUNBOOK.md
    about: The runbook says what every acquisition and publication refusal means.
