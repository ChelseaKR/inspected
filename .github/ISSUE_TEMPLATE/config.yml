# Blank issues stay on, deliberately. Not every useful note is a bug report or a
# measurement proposal: issues #16 to #23 are maintainer written and fit neither form,
# and routing a note about a Makefile target through a form that demands a denominator
# collects fiction or collects nothing.
blank_issues_enabled: true
contact_links:
